<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "LearningResource",
  "name": "ネットワーククエスト ― 届け！そのパケット ―",
  "alternateName": "NET QUEST",
  "description": "ケーブル配線からスイッチ・IPアドレス・ARP・ルーター・DHCP・DNSまで、パケットの旅を目で追いながらネットワークの仕組みを学べる無料学習ゲーム。",
  "url": "https://informatics.habatakijuku.com/net-quest/",
  "inLanguage": "ja",
  "learningResourceType": "learning activity",
  "teaches": "ネットワークの仕組み（OSI参照モデル・MACアドレス・IPアドレス・ARP・ルーティング・DHCP・DNS）",
  "isAccessibleForFree": true,
  "author": { "@type": "Person", "name": "ruglerugle" }
}

<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app-shell side-collapsed" id="app-shell">
  <header class="game-header">
    <div class="brand">
      <h1 class="brand-title">ネットワーククエスト</h1>
      <div class="brand-sub">― 届け！そのパケット ―</div>
    </div>
    <div class="head-progress-wrap">
      <div class="head-progress-label" id="progress-label">クリア 0 / 6</div>
      <div class="head-progress"><div class="head-progress-fill" id="progress-fill"></div></div>
    </div>
    <div class="header-actions">
      <a class="head-btn home-badge" href="/" title="クエスト集トップへ" aria-label="クエスト集トップへ">🧭</a>
      <button id="head-nav-toggle" class="head-btn" title="ステージ一覧の表示切替">☰ ナビ</button>
    </div>
  </header>

  <div class="game-layout">
    <div class="side-backdrop" id="side-backdrop"></div>
    <aside class="side-panel" id="stage-sidebar">
      <div class="side-head">
        <button class="side-toggle" id="sidebar-toggle" title="ステージ一覧の表示切替" aria-label="ステージ一覧の表示切替">☰</button>
        <span class="side-head-text">ステージ一覧</span>
      </div>
      <nav id="stage-nav" class="step-list"></nav>
    </aside>

    <main class="main-area" id="main-area">
      <div id="dialogue-panel"></div>

      <div id="mission-banner">
        <div id="mission-title"></div>
        <div id="mission-text"></div>
        <div id="mission-status"></div>
      </div>

      <section id="stage-area">
        <div id="svg-wrap">
          <svg id="network-svg" viewBox="0 0 900 480" preserveAspectRatio="xMidYMid meet"></svg>
          <div id="live-status"></div>
        </div>
        <div id="stage-actions"></div>
      </section>

      <div id="packet-detail-box">
        <h3>パケット詳細</h3>
        <div id="packet-detail"><p class="hint">一時停止してパケットをクリックすると中身が見られます</p></div>
      </div>
      <div id="table-views"></div>

      <footer id="control-bar">
        <button id="btn-play" title="再生">▶ 再生</button>
        <button id="btn-pause" title="一時停止">⏸ 一時停止</button>
        <button id="btn-step" title="1ステップ進める">1ステップ</button>
        <label class="speed-label">速度
          <input type="range" id="speed-slider" min="0.5" max="3" step="0.5" value="1">
        </label>
        <button id="btn-reset" title="ステージをやり直す">↺ ステージリセット</button>
      </footer>

      <div id="log-panel">
        <h3>通信ログ</h3>
        <ul id="log-list"></ul>
      </div>

      <div id="book-recommend"></div>

      <section id="ending-screen" hidden></section>
    </main>
  </div>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
